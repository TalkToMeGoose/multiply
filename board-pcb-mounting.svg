><rect x="-40" y="-28" width="80" height="55" rx="3" fill="#f5f1df" /><text x="0" y="-6" font-family="Arial,sans-serif" font-size="15" fill="#253a3b" text-anchor="middle">6×7</text></g><polygon points="80,250 396,222.35358232580802 396,234.35358232580802 80,262" fill="#218c88" /><polygon points="484,214.6545799355267 820,185.25838899081623 820,197.25838899081623 484,226.6545799355267" fill="#218c88" /><path d="M780 293.6328221671124 L850 293.6328221671124 L850 185 L878 185" fill="none" stroke="#a9bdb9" stroke-width="1.5"/><text x="890" y="190" font-family="Arial,sans-serif" font-size="25" fill="#253a3b" >Screws through PCB holes</text><text x="890" y="225" font-family="Arial,sans-serif" font-size="22" fill="#5c706e" >Hold the board down on posts.</text><path d="M800 301.00816226133475 L850 301.00816226133475 L850 295 L878 295" fill="none" stroke="#a9bdb9" stroke-width="1.5"/><text x="890" y="300" font-family="Arial,sans-serif" font-size="25" fill="#253a3b" >Flat custom PCB</text><text x="890" y="335" font-family="Arial,sans-serif" font-size="22" fill="#5c706e" >Parallel to the button guide plate.</text><path d="M632 440 L850 440 L850 405 L878 405" fill="none" stroke="#a9bdb9" stroke-width="1.5"/><text x="890" y="410" font-family="Arial,sans-serif" font-size="25" fill="#253a3b" >Extra support underneath</text><text x="890" y="445" font-family="Arial,sans-serif" font-size="22" fill="#5c706e" >Limits flex when keys are pressed.</text><path d="M790 548 L850 548 L850 515 L878 515" fill="none" stroke="#a9bdb9" stroke-width="1.5"/><text x="890" y="520" font-family="Arial,sans-serif" font-size="25" fill="#253a3b" >Printed mounting posts</text><text x="890" y="555" font-family="Arial,sans-serif" font-size="22" fill="#5c706e" >Part of the hollow bottom shell.</text><text x="80" y="700" font-family="Arial,sans-serif" font-size="27" fill="#253a3b" >The posts set the height. The screws prevent lifting or shifting.</text><text x="80" y="749" font-family="Arial,sans-serif" font-size="24" fill="#5c706e" >Support pads sit in clear PCB areas, away from switch legs and solder joints.</text><text x="80" y="797" font-family="Arial,sans-serif" font-size="24" fill="#5c706e" >The top and bottom shell also screw together; artwork does not hold the electronics.</text><text x="48" y="860" font-family="Arial,sans-serif" font-size="23" fill="#5c706e" >Illustrative mounting positions · screw sizes, clearances and support count still to design</text></svg>